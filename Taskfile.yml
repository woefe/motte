---
version: "3"

# Buffer each command's output and print it as one block when it finishes, so
# parallel tasks do not interleave their lines. Trade-off: no live feedback
# while a long command (e.g. go test) is running.
output: group

tasks:
  # All checks run in parallel; failfast stops the rest once one fails.
  lint:
    desc: Run all linters and Go checks in parallel
    deps: [editorconfig, yamllint, hadolint, go]
    failfast: true

  editorconfig:
    cmds:
      - editorconfig-checker

  yamllint:
    cmds:
      - yamllint .github/workflows/*.yml Taskfile.yml

  hadolint:
    cmds:
      - hadolint docker/*/Dockerfile

  go:
    cmds:
      # golangci-lint covers vet-style linters + formatting (see .golangci.yml).
      - golangci-lint run ./...
      - go test ./...
      - go build -o /dev/null .

  # Local builds for trying image changes without pushing: the images are
  # tagged with the same ghcr.io refs the profiles reference, so a subsequent
  # `go run . <profile> --no-pull` boots them. name=golang or name=web builds
  # the base plus that one variant.
  build-images:
    desc: Build images locally and load them into the msb cache (name=golang|web builds one variant)
    vars:
      PROFILES: '{{if .name}}{{.name}}{{else}}golang web{{end}}'
    cmds:
      - task: image-base
      - for:
          var: PROFILES
        task: image-variant
        vars:
          VARIANT: "{{.ITEM}}"

  # --pull refreshes the rolling archlinux:latest like CI's clean builder.
  image-base:
    internal: true
    vars:
      REF: ghcr.io/woefe/motte/base:latest
    cmds:
      - podman build --pull -t {{.REF}} docker/base
      - podman save {{.REF}} | msb load

  # No --pull here: the variant must build from the base task above, not the
  # registry's, or a locally changed base would be ignored.
  image-variant:
    internal: true
    vars:
      REF: ghcr.io/woefe/motte/{{.VARIANT}}:latest
    cmds:
      - podman build -t {{.REF}} docker/{{.VARIANT}}
      - podman save {{.REF}} | msb load
