---
version: "3"

output: prefixed

tasks:
  # All checks run in parallel; failfast stops the rest once one fails.
  lint:
    desc: Run all linters and Go checks in parallel
    deps: [editorconfig, yamllint, hadolint, golangci-lint, build, test]
    failfast: true

  editorconfig:
    cmds:
      - editorconfig-checker

  yamllint:
    cmds:
      - yamllint .github/workflows/*.yml Taskfile.yml

  hadolint:
    cmds:
      - hadolint docker/*/Dockerfile

  golangci-lint:
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run the tests and report coverage
    vars:
      TEST_PKGS:
        sh: go list ./... | grep -v /testutil | paste -sd, -
      COVERAGE_FILE: coverage.out
      COVERAGE_HTML: coverage.html
    cmds:
      - go test -covermode=atomic -coverprofile={{.COVERAGE_FILE}} -coverpkg={{.TEST_PKGS}} ./...
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}
      - go tool cover -func={{.COVERAGE_FILE}} | tail -n1 | tee -a ${GITHUB_STEP_SUMMARY:+"$GITHUB_STEP_SUMMARY"}

  build:
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      OUTPUT: '{{.OUTPUT | default "motte"}}'
    env:
      CGO_ENABLED: "1"
    cmds:
      - >-
        go build -buildmode=pie -trimpath
        -ldflags="-s -w -X github.com/woefe/motte/internal/cli.version={{.VERSION}}"
        -o {{.OUTPUT}} ./cmd/motte

  dist:
    desc: Build and package a release tarball into dist (VERSION=<tag> and PLATFORM=<label> override the defaults)
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      PLATFORM: '{{.PLATFORM | default "native" }}'
    cmds:
      - rm -rf dist && mkdir -p dist
      - task: build
        vars:
          VERSION: "{{.VERSION}}"
          OUTPUT: dist/motte
      - ./dist/motte --version
      - cp COPYING README.md dist/
      - tar -czf dist/motte_{{.VERSION | trimPrefix "v"}}_{{.PLATFORM}}.tar.gz -C dist motte COPYING README.md

  # Local builds for trying image changes without pushing: the images are
  # tagged with the same ghcr.io refs the profiles reference, so a subsequent
  # `go run ./cmd/motte <profile> --no-pull` boots them. name=golang,
  # name=rails, or name=web builds the base plus that one variant;
  # name=base rebuilds only the base image.
  build-images:
    desc: Build images locally and load them into the msb cache (name=base|golang|rails|web builds one variant)
    cmds:
      - task: build-base-image
      - task: build-variants
        if: '{{ ne .name "base" }}'

  build-variants:
    internal: true
    vars:
      PROFILES: '{{if .name}}{{.name}}{{else}}golang rails web{{end}}'
    deps:
      - for:
          var: PROFILES
        task: image-variant
        vars:
          VARIANT: "{{.ITEM}}"

  build-base-image:
    internal: true
    vars:
      REF: ghcr.io/woefe/motte/base:latest
    cmds:
      # --pull refreshes the rolling archlinux:latest like CI's clean builder.
      - podman build --pull -t {{.REF}} docker/base
      - podman save {{.REF}} | msb load

  image-variant:
    internal: true
    prefix: "image-variant:{{.VARIANT}}"
    vars:
      REF: ghcr.io/woefe/motte/{{.VARIANT}}:latest
    cmds:
      # No --pull here: the variant must build from the build-base-image task
      # above, not the registry, or a locally changed base would be ignored.
      - podman build -t {{.REF}} docker/{{.VARIANT}}
      - podman save {{.REF}} | msb load
