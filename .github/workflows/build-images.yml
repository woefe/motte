---
name: build-images

on:
  schedule:
    # Mondays 04:00 UTC — weekly rolling rebuild (fresh archlinux base + packages).
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase image refs.
      - name: Lowercase the image namespace
        run: |
          echo "IMAGE_NS=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the build-date tag
        run: |
          echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build and push the base image
        uses: docker/build-push-action@v6
        with:
          context: docker/base
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NS }}/base:latest
            ghcr.io/${{ env.IMAGE_NS }}/base:${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  variants:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [golang, web]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image namespace
        run: |
          echo "IMAGE_NS=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Variants FROM the freshly-pushed base, so GHCR login must come first.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the build-date tag
        run: |
          echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build and push the ${{ matrix.variant }} image
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.variant }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NS }}/${{ matrix.variant }}:latest
            ghcr.io/${{ env.IMAGE_NS }}/${{ matrix.variant }}:${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ env.IMAGE_NS }}/base:latest
