---
version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - misspell
    - godot
    - gocritic
    - modernize
    - dupl
    - sloglint
  settings:
    sloglint:
      static-msg: true
      key-naming-case: snake

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
      tab-len: 4
